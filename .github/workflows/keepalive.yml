name: Keep Supabase awake

# Supabase Free pauses projects after ~7 days without activity.
# This pings /api/health (one tiny DB query) every 3 days.
on:
  schedule:
    - cron: "17 3 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: curl -fsS --retry 3 --retry-delay 10 "${{ secrets.APP_ORIGIN }}/api/health"
